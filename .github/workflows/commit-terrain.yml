name: 3D contribution terrain

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - "terrain-Arqamz.svg" # don't re-trigger on the bot's own commit

jobs:
  generate:
    permissions:
      contents: write # lets the built-in GITHUB_TOKEN push the updated SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render 3D contribution terrain
        uses: Arqamz/gh-contributions-3d@main
        with:
          github_user: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output: terrain-Arqamz.svg
          # angle: medium      # low | medium | high | top, or a rowRise number
          # smoothness: "1"    # 0 (sharp low-poly) .. 1 (smooth hills)
          # mode: terrain      # terrain | columns

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terrain-Arqamz.svg
          git diff --staged --quiet || git commit -m "chore: update 3D contribution terrain"
          git push
