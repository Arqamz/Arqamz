name: 3D contribution terrain

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - "terrain-Arqamz.svg" # don't re-trigger on the bot's own commit

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: runner
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Render 3D contribution terrain
        uses: Arqamz/gh-contributions-3d@main
        with:
          github_user: ${{ github.repository_owner }}
          github_token: ${{ secrets.TOKEN_GITHUB }}
          output: terrain-Arqamz.svg
          # angle: medium      # low | medium | high | top, or a rowRise number
          # smoothness: "1"    # 0 (sharp low-poly) .. 1 (smooth hills)
          # mode: terrain      # terrain | columns

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          git config --local user.email "arqam.mzia@gmail.com"
          git config --local user.name "arqamz"
          git add terrain-Arqamz.svg
          git commit -m "chore: update 3D contribution terrain" || echo "No changes to commit"
          git remote set-url origin https://arqamz:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git push origin HEAD:main
